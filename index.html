<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2EAD3">
  <meta name="description" content="Desarrollamos sistemas y páginas web a medida para ordenar tu emprendimiento.">
  <title>Consultorio — De la charla, al sistema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#inicio" aria-label="Consultorio, inicio">
        <img src="assets/logo-header.png" alt="Consultorio">
      </a>
      <div class="header-message" aria-label="De la charla, al sistema. Impulsamos tu emprendimiento.">
        <p class="header-slogan"><span>De la charla,</span> <span>al sistema.</span></p>
        <p class="header-tagline">Impulsamos tu emprendimiento.</p>
      </div>
      <a class="button header-cta" href="mailto:hola@consultorio.com">Hablemos <span class="header-arrow" aria-hidden="true">→</span></a>
    </div>
  </header>

  <main>
    <!-- Sección 1: Hero -->
    <section class="hero" id="inicio" aria-labelledby="hero-title">
      <span class="hero-glow hero-glow--pink" aria-hidden="true"></span>
      <span class="hero-glow hero-glow--cyan" aria-hidden="true"></span>
      <span class="hero-glow hero-glow--orange" aria-hidden="true"></span>
      <div class="hero-panel">
        <div class="hero-copy">
          <h1 id="hero-title">Tu idea es puro <span class="word-chaos">caos.</span><br class="hero-break"> <span class="hero-second-line">Nosotros la hacemos <span class="word-system">sistema.</span></span></h1>
          <p class="hero-description">Desarrollamos sistemas y páginas web a medida. Primero escuchamos cómo trabajás, después ordenamos todo en algo que funciona.</p>
          <div class="hero-actions">
            <a class="button" href="mailto:hola@consultorio.com">Conocenos <span class="button-arrow" aria-hidden="true">→</span></a>
            <a class="button" href="#proceso">Cómo trabajamos <span class="button-arrow" aria-hidden="true">→</span></a>
          </div>
        </div>
      </div>
      <div class="hero-art">
        <img src="assets/stickman.png" alt="Stickman sentado en un sillón, escribiendo en una libreta">
        <span class="hero-chip hero-chip--idea" aria-hidden="true"><i></i>Idea</span>
        <span class="hero-chip hero-chip--plan" aria-hidden="true"><i></i>Plan</span>
        <span class="hero-chip hero-chip--system" aria-hidden="true"><i></i>Sistema ✓</span>
      </div>
      <svg class="hero-wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 42C180 92 315 98 480 65c170-34 254-39 418-2 182 42 347 49 542-8v65H0V42Z" fill="#EBDFC0"/>
      </svg>
    </section>
  </main>
</body>
</html>
